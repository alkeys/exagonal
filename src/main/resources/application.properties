spring.application.name=0.0.1

#===============================
# SERVER configuration
#===============================
server.port=8080

#configara el  modo development para que se recargue automáticamente la aplicación cuando se realizan cambios en el código fuente.
spring.devtools.restart.enabled=true

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres-db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
#configuración de la conexión a la base de datos mediate un pul de 10 conexiones que estan activas y disponibles para ser utilizadas por la aplicación.
spring.datasource.hikari.maximum-pool-size=10


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect






# ===============================
# actiar las migraciones de flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# JWT - Configuración de autenticación
# ===============================

# Clave secreta utilizada para firmar y validar los JWT.
app.jwt.secret=<xJpMIvVgh4ydIvB00Gblem7SOoRUKumtIltw0iFJT72XQ+UWm+b9ENZ8Wonzfd6iWR0+OxxtwaKeXvPs9cUt2A==

# Tiempo de expiración del JWT en milisegundos.
# 86400000 ms = 24 horas.
app.jwt.expiration-ms=86400000

# Nombre de la cookie donde se almacenará el JWT.
app.jwt.cookie-name=jwt

# Ruta donde la cookie estará disponible.
# "/" significa que se enviará para todas las rutas del dominio.
app.jwt.cookie-path=/

# Indica si la cookie solo debe enviarse mediante HTTPS.
# false = permite HTTP, útil para desarrollo local.
# En producción debería utilizarse true.
app.jwt.cookie-secure=true

# Política SameSite de la cookie.
# Lax evita que el navegador envíe la cookie en la mayoría
# de solicitudes realizadas desde sitios de terceros.
# Esto ayuda a reducir el riesgo de ataques CSRF.
#
# Lax permite que la cookie se envíe normalmente en solicitudes
# del mismo sitio y en algunas navegaciones desde otros sitios.
app.jwt.cookie-same-site=Lax

# Permite que Swagger UI reenvie cookies en las peticiones Try it out.
springdoc.swagger-ui.with-credentials=true


#permite recargar la documentación de Swagger UI desde un dominio diferente al del backend.
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs